name: Build

run-name: ${{ github.actor }} is learning GitHub Actions 4444

on:
  push:
    branches: 
      - main
    braches-ignore: [ 'gh-pages' ]
  pull_request:
    branches: [ main ]
  fork:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *' # every day at midnight
  
permissions: read-all

jobs:
  test:
    name: Test all test cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    name: Build the project
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
  # deploy:
  #   needs: [test, build]
  #   runs-on: ubuntu-latest
  #   env:
  #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  #     # Pushes to main go to production; everything else is a preview deploy.
  #     VERCEL_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version-file: .nvmrc
  #         cache: npm
  #     - run: npm install --global vercel@latest
  #     - run: vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
  #     - run: vercel build ${{ env.VERCEL_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
  #     - run: vercel deploy --prebuilt ${{ env.VERCEL_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

  deploy:
    name: Deploy to Vercel
    needs: [test, build]
    runs-on: macos-latest #ubuntu-24.04-arm #windows-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Pushes to main go to production; everything else is a preview deploy.
      VERCEL_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      #VERCEL_ENV: 'production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          #node-version: '20'
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN}}

  deploy2:
    name: Deploy to other server
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: echo "Deploying to other server..."

  send-notification:
    name: Send notification
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Sending notification..."